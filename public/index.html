<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <main class="contenedor-principal">
        <div class="mx-auto" style="max-width: 1100px;">

            <!-- Inicio de sesión -->
            <section id="login-section" class="justify-content-center p-5">
                <div class="w-100" style="max-width: 400px;">

                    <h1 class="h3">Inicio de sesión</h1>

                    <form id="login-form">
                        <div class="mb-3">
                            <label for="usuario" class="form-label">Usuario</label>
                            <input id="usuario" required class="form-control">
                        </div>

                        <div>
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" id="password" required class="form-control">
                        </div>

                        <button type="submit" class="btn btn-dark w-100">Iniciar sesión</button>
                    </form>

                    <p id="login-message" class="text-danger text-center mt-3"></p>
                </div>

            </section>


            <!-- Panel principal -->
            <section id="panel-section" style="display: none;">

                <header class="d-flex justify-content-between align-items-center p-4">
                    <h1 class="h3 mb-0">Panel de gestión</h1>
                    <button id="logout-button" class="btn btn-outline-danger">Cerrar sesión</button>
                </header>

                <!-- Navegación -->
                <nav class="navbar navbar-expand-lg border-top border-bottom px-4">
                    <div class="container-fluid p-0">
                        <div class="navbar-nav flex-row gap-3">
                            <button data-section="categorias-section" class="nav-link">Categorías</button>
                            <button data-section="productos-section" class="nav-link">Productos</button>
                            <button data-section="clientes-section" class="nav-link">Clientes</button>
                            <button data-section="ventas-section" class="nav-link">Ventas</button>
                        </div>
                    </div>
                </nav>
                <br>


                <!-- Categorías -->
                <section id="categorias-section">

                    <h2 class="mb-3">Categorías</h2>
                    <div class="row justify-content-center">
                        <div class="">
                            <form id="categoria-form" class="p-4 shadow-sm mb-4">

                                <input type="hidden" id="categoria-id">

                                <div class="mb-3">
                                    <label for="categoria-nombre" class="form-label">Nombre</label>
                                    <input type="text" id="categoria-nombre" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label for="categoria-descripcion" class="form-label">Descripción</label>
                                    <input type="text" id="categoria-descripcion" class="form-control">
                                </div>

                                <div class="d-flex gap-2">

                                    <button type="submit" class="btn btn-primary">Guardar categoría</button>
                                    <button type="button" class="btn btn-secondary cancelar-operacion">Cancelar</button>

                                </div>
                            </form>
                            <div class="mt-4 shadow-sm">
                                <div class="">
                                    <div class="table-responsive">
                                        <table class="table table-striped table-hover align-middle">
                                            <thead class="table-dark">
                                                <tr>
                                                    <th>ID</th>
                                                    <th>Nombre</th>
                                                    <th>Descripción</th>
                                                    <th>Acciones</th>
                                                </tr>
                                            </thead>

                                            <tbody id="categorias-table">
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>

                </section>


                <!-- Productos -->
                <section id="productos-section" style="display: none;">

                    <h2 class="mb-3">Productos</h2>
                    <div class="row justify-content-center">
                        <form id="producto-form" class="p-4 shadow-sm mb-4">

                            <input type="hidden" id="producto-id">

                            <div class="mb-3">
                                <label for="producto-sku" class="form-label">SKU</label>
                                <input type="text" id="producto-sku" required class="form-control">
                            </div>

                            <div>
                                <label for="producto-nombre" class="form-label">Nombre</label>
                                <input type="text" id="producto-nombre" required class="form-control">
                            </div>

                            <div>
                                <label for="producto-precio" class="form-label">Precio</label>
                                <input type="number" id="producto-precio" min="0.01" step="0.01" required
                                    class="form-control">
                            </div>

                            <div>
                                <label for="producto-stock" class="form-label">Stock</label>
                                <input type="number" id="producto-stock" min="1" required class="form-control">
                            </div>

                            <div>
                                <label for="producto-categoria" class="form-label">Categoría</label>
                                <select id="producto-categoria" required class="form-select mb-3">
                                    <option value="">Seleccione una categoría</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary">Guardar producto</button>
                            <button type="button" class="btn btn-secondary cancelar-operacion">Cancelar</button>
                        </form>
                        <div class="mt-4 shadow-sm">
                            <div>
                                <table class="table table-striped table-hover align-middle">
                                    <thead class="table-dark">
                                        <tr>
                                            <th>ID</th>
                                            <th>SKU</th>
                                            <th>Nombre</th>
                                            <th>Precio</th>
                                            <th>Stock</th>
                                            <th>Categoría</th>
                                            <th>Acciones</th>
                                        </tr>
                                    </thead>

                                    <tbody id="productos-table">
                                    </tbody>
                                </table>
                            </div>

                        </div>

                    </div>

                </section>


                <!-- Clientes -->
                <section id="clientes-section" style="display: none;">

                    <h2 class="mb-3">Clientes</h2>
                    <div class="row justify-content-center">

                        <form id="cliente-form" class="p-4 shadow-sm mb-4">

                            <input type="hidden" id="cliente-id">

                            <div class="mb-3">
                                <label for="cliente-nombre" class="form-label">Nombre</label>
                                <input type="text" id="cliente-nombre" required class="form-control">
                            </div>

                            <div class="mb-3">
                                <label for="cliente-email" class="form-label">Correo electrónico</label>
                                <input type="email" id="cliente-email" required class="form-control">
                            </div>

                            <div class="mb-3">
                                <label for="cliente-telefono" class="form-label">Teléfono</label>
                                <input type="text" id="cliente-telefono" class="form-control">
                            </div>

                            <div class="mb-3">
                                <label for="cliente-direccion" class="form-label">Dirección</label>
                                <input type="text" id="cliente-direccion" class="form-control">
                            </div>

                            <button type="submit" class="btn btn-primary">Guardar cliente</button>
                            <button type="button" class="btn btn-sencondary cancelar-operacion">Cancelar</button>
                        </form>

                        <div class="mt-4 shadow-sm">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover align-middle">
                                    <thead class="table-dark">
                                        <tr>
                                            <th>ID</th>
                                            <th>Nombre</th>
                                            <th>Email</th>
                                            <th>Teléfono</th>
                                            <th>Dirección</th>
                                            <th>Acciones</th>
                                        </tr>
                                    </thead>

                                    <tbody id="clientes-table">
                                    </tbody>
                                </table>
                            </div>

                        </div>

                    </div>

                </section>


                <!-- Ventas -->
                <section id="ventas-section" style="display: none;">

                    <h2 class="mb-3">Ventas</h2>
                    <div class="row justify-content-center">

                        <form id="venta-form" class="p-4 shadow-sm mb-4">

                            <input type="hidden" id="venta-id">

                            <div class="mb-3">
                                <label for="venta-producto" class="form-label">Producto</label>
                                <select id="venta-producto" required class="form-select mb-3">
                                    <option value="">Seleccione un producto</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="venta-cliente" class="form-label">Cliente</label>
                                <select id="venta-cliente" required class="form-select mb-3">
                                    <option value="">Seleccione un cliente</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="venta-cantidad" class="form-label">Cantidad</label>
                                <input type="number" id="venta-cantidad" min="1" required class="form-control">
                            </div>

                            <div class="mb-3">
                                <label for="venta-total" class="form-label">Total</label>
                                <input type="number" id="venta-total" min="0.01" step="0.01" required
                                    class="form-control">
                            </div>

                            <button type="submit" class="btn btn-primary">Registrar venta</button>
                            <button type="button" class="btn btn-secondary cancelar-operacion">Cancelar</button>
                        </form>
                    </div>

                    <div class="mt-4 shadow-sm">

                        <table class="table table-striped table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Producto</th>
                                    <th>Cliente</th>
                                    <th>Cantidad</th>
                                    <th>Total</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>

                            <tbody id="ventas-table">
                            </tbody>
                        </table>
                    </div>

                </section>

            </section>
        </div>

    </main>

    <script src="app.js"></script>
</body>

</html>
